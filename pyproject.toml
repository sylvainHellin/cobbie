[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobbie"
version = "0.1.0"
description = "An AI agent that can answer any question related to a given BIM model in .ifc format."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "arize-phoenix==8.24.0",
    "baml-py>=0.211.2",
    "fastapi[standard]>=0.115.9",
    "ifcopenshell>=0.8.2",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "mermaid-magic>=0.1.4",
    "mlflow>=3.1.0",
    "mypy>=1.16.1",
    "ollama>=0.4.8",
    "openinference-instrumentation-smolagents>=0.1.11",
    "openpyxl>=3.1.5",
    "opentelemetry-exporter-otlp>=1.32.1",
    "opentelemetry-sdk>=1.32.1",
    "pydantic>=2.11.4",
    "python-dotenv>=1.1.0",
    "result>=0.17.0",
    "sqlacodegen>=3.1.1",
    "sqlmodel>=0.0.25",
    "tabulate>=0.9.0",
    "tiktoken>=0.12.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ty.rules]
possibly-missing-attribute = "ignore"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[project.optional-dependencies]
dev = [
    "ty>=0.0.1a6",
]
