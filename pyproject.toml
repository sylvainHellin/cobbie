[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobbie"
version = "0.1.0"
description = "An AI agent that can answer any question related to a given BIM model in .ifc format."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "arize-phoenix==8.24.0",
    "baml-py==0.218.1",
    "docutils>=0.22.4",
    "fastapi[standard]>=0.115.9",
    "ifcopenshell>=0.8.2; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "krippendorff>=0.7.0",
    "loguru>=0.7.3",
    "mermaid-magic>=0.1.4",
    "mlflow>=3.1.0",
    "mypy>=1.16.1",
    "ollama>=0.4.8",
    "openinference-instrumentation-smolagents>=0.1.11",
    "openpyxl>=3.1.5",
    "opentelemetry-exporter-otlp>=1.32.1",
    "opentelemetry-sdk>=1.32.1",
    "pydantic>=2.11.4",
    "python-dotenv>=1.1.0",
    "result>=0.17.0",
    "rtree>=1.4.1",
    "scikit-learn>=1.6.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.2.0",
    "shapely>=2.0.0",
    "sqlacodegen>=3.1.1",
    "sqlite-vec>=0.1.6",
    "chromadb>=1.0.0",
    "rank-bm25>=0.2.2",
    "sqlmodel>=0.0.25",
    "streamlit>=1.41.0",
    "tabulate>=0.9.0",
    "tiktoken>=0.12.0",
    "trimesh>=4.0.0",
    "mlx>=0.30.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.29.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ty.rules]
possibly-missing-attribute = "ignore"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[project.optional-dependencies]
dev = [
    "ty>=0.0.1a6",
]
