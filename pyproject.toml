[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobbie"
version = "0.1.0"
description = "An AI agent that can answer any question related to a given BIM model in .ifc format."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "docutils>=0.22.4",
    "ifcopenshell>=0.8.2",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "loguru>=0.7.3",
    "mypy>=1.16.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.11.4",
    "python-dotenv>=1.1.0",
    "result>=0.17.0",
    "rtree>=1.4.1",
    "scikit-learn>=1.6.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.2.0",
    "sqlite-vec>=0.1.6",
    "chromadb>=1.0.0",
    "rank-bm25>=0.2.2",
    "sqlmodel>=0.0.25",
    "tabulate>=0.9.0",
    "tiktoken>=0.12.0",
    # New harness + analysis stack
    "langchain>=0.3",
    "langgraph>=0.2",
    "deepagents",
    "jupyter-client>=8",
    "google-genai>=0.3",
    "langchain-openai>=1.3.2",
    "langchain-google-genai>=4.2.5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ty.rules]
possibly-missing-attribute = "ignore"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[project.optional-dependencies]
dev = [
    "ty>=0.0.1a6",
]
