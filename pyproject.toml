[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobbie"
version = "0.1.0"
description = "Cobbie ACC — reproduction package for the EC3 paper on automated code compliance with IFC models."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "baml-py==0.218.1",
    "ifcopenshell>=0.8.2; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "loguru>=0.7.3",
    "mlflow>3.5.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dotenv>=1.1.0",
    "requests>=2.31",
    "scipy>=1.13",
    "shapely>=2.0.0",
    "tiktoken>=0.12.0",
    "trimesh>=4.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ty.rules]
possibly-missing-attribute = "ignore"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "ty>=0.0.1a6",
]
